# Opens Jobs from the computer's session list, checks the job row reads Active, swipes it left, and pauses it. Rows
# read "<name>, Active|Paused|Error".
# env: MACHINE_NAME, JOB_NAME
appId: com.heyskylark.ompmobile
name: jobs-pause
---
- launchApp
- extendedWaitUntil:
    visible: "Computer, ${MACHINE_NAME}, Online.*"
    timeout: 30000
- tapOn: "Computer, ${MACHINE_NAME}, Online.*"
- tapOn: "Jobs"
- extendedWaitUntil:
    visible: "${JOB_NAME}, Active"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: jobs-01-active
- swipe:
    from: "${JOB_NAME}, Active"
    direction: LEFT
- extendedWaitUntil:
    visible: "Pause"
    timeout: 5000
- assertVisible: "Delete"
- waitForAnimationToEnd
- takeScreenshot: jobs-02-actions
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "${JOB_NAME}, Paused"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: jobs-03-paused
