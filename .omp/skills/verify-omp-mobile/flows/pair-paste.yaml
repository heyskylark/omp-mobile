# From the open Add computer sheet (open-add-computer.yaml), taps the clipboard button, which pastes the device
# pasteboard into the link field and connects.
# Immediately before running: printf %s '<link>' | xcrun simctl pbcopy <SIM_UDID>
# (Maestro's setClipboard is Maestro-internal and never reaches the app. When Simulator.app syncs the Mac
# pasteboard, anything copied on the Mac replaces the link, so keep the gap to the tap short.)
# The typed-link + Connect path is not driven: the keyboard covers the field and Connect (see features/pairing.md).
# env: MACHINE_NAME
appId: com.heyskylark.ompmobile
name: pair-paste
---
- tapOn: "paste"
# iOS may ask before the app reads a pasteboard it did not write.
- runFlow:
    when:
      visible: "Allow Paste"
    commands:
      - tapOn: "Allow Paste"
# First pairing on an install asks for notification permission (the app registers for push while pairing).
- extendedWaitUntil:
    visible: "(“OMP” Would Like to Send You Notifications|${MACHINE_NAME})"
    timeout: 30000
- runFlow:
    when:
      visible: "“OMP” Would Like to Send You Notifications"
    commands:
      - takeScreenshot: pair-02b-notification-permission
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: ${MACHINE_NAME}
    timeout: 30000
- takeScreenshot: pair-03-machine-sessions
