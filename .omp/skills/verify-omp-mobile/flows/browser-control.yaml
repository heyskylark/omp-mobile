# Opens the browser screen from a session header against bin/fake-browser-relay.ts, takes control, taps the
# middle of the frame, types, erases a character, presses the Tab key button, pastes the phone's clipboard,
# double-taps the frame and copies, hands back, and opens the tab picker. The relay's CMD lines are the proof that
# each input arrived, and the simulator's pasteboard holds the copied text afterwards (features/browser.md).
# env: MACHINE_NAME, SESSION (regex for a session row in this computer's list)
appId: com.heyskylark.ompmobile
name: browser-control
---
- launchApp
- extendedWaitUntil:
    visible: "Computer, ${MACHINE_NAME}, Online.*"
    timeout: 30000
- tapOn: "Computer, ${MACHINE_NAME}, Online.*"
- extendedWaitUntil:
    visible: ${SESSION}
    timeout: 15000
- tapOn: ${SESSION}
- extendedWaitUntil:
    visible: "Browser"
    timeout: 30000
- tapOn: "Browser"
# Primary buttons read as "<SF Symbol>, <title>".
- extendedWaitUntil:
    visible: ".*, Take control"
    timeout: 30000
- takeScreenshot: control-01-watching
- tapOn: ".*, Take control"
- extendedWaitUntil:
    visible: ".*, Hand back"
    timeout: 15000
- takeScreenshot: control-02-in-control
- tapOn: "Browser tab"
- tapOn: "Keyboard"
- inputText: "hello"
- eraseText: 1
- tapOn: "Tab key"
- takeScreenshot: control-03-typing
- tapOn: "Keyboard"
# iOS's paste control, which reads the pasteboard set before the flow.
- tapOn: "Paste"
- doubleTapOn: "Browser tab"
# Holding starts a selection: Chrome gets a held mouse button, released when the finger lifts.
- longPressOn: "Browser tab"
# The "Copied" toast lasts 3.5 s, shorter than Maestro takes to look again while frames stream; the simulator's
# pasteboard is the proof instead.
- tapOn: "Copy"
- takeScreenshot: control-04-copied
- tapOn: ".*, Hand back"
- extendedWaitUntil:
    visible: ".*, Take control"
    timeout: 15000
- takeScreenshot: control-05-handed-back
- tapOn: "Tabs"
- extendedWaitUntil:
    visible: "Fake sign-in page, example\\.com"
    timeout: 10000
- takeScreenshot: control-06-picker
- tapOn: "Close"
