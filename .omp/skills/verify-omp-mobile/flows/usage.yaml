# Opens the composer's + menu on New session, picks Usage, and closes the sheet with its top-left Close button. On a
# run's first pass no project is picked yet, so this also proves Usage works before Send is possible. Then starts a
# session (one small model turn), opens Usage from its composer's menu, and swipes the sheet down. Rows read
# "<label>, <N>% used".
# env: MACHINE_NAME, PROMPT
appId: com.heyskylark.ompmobile
name: usage
---
- launchApp
- extendedWaitUntil:
    visible: "Computer, ${MACHINE_NAME}, Online.*"
    timeout: 30000
- tapOn: "Computer, ${MACHINE_NAME}, Online.*"
- tapOn: "add"
- extendedWaitUntil:
    visible: "New session"
    timeout: 15000
- tapOn: "Message OMP"
- tapOn: "Composer menu"
- extendedWaitUntil:
    visible: "Usage"
    timeout: 5000
- assertVisible: "Photos"
- waitForAnimationToEnd
- takeScreenshot: usage-01-menu
- tapOn: "Usage"
- extendedWaitUntil:
    visible: ".*, \\d+% used"
    timeout: 30000
- assertVisible: "Close"
- waitForAnimationToEnd
- takeScreenshot: usage-02-sheet
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 10000
- assertVisible: "New session"
- takeScreenshot: usage-03-closed
- tapOn: ".*Browse.*"
- extendedWaitUntil:
    visible: "Choose folder"
    timeout: 15000
- tapOn: ".*project.*"
- tapOn: ".*Use this folder.*"
- extendedWaitUntil:
    visible: ".*project.*"
    timeout: 15000
- tapOn: "Message OMP"
- inputText: "${PROMPT}"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "Session menu"
    timeout: 60000
- extendedWaitUntil:
    visible: "Send"
    timeout: 180000
- tapOn: "Composer menu"
- tapOn: "Usage"
- extendedWaitUntil:
    visible: ".*, \\d+% used"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: usage-04-session-sheet
- swipe:
    start: 50%, 12%
    end: 50%, 95%
    duration: 400
- extendedWaitUntil:
    notVisible: "Close"
    timeout: 10000
- assertVisible: "Session menu"
- takeScreenshot: usage-05-swiped-down
